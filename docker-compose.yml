# NOTE: This compose file is for LOCAL DEMO / DEVELOPMENT ONLY.
# The credentials below (database and Moodle admin passwords) are throwaway
# defaults for a disposable local stack. Do NOT use them in production: set
# strong secrets via environment variables / a .env file before any real
# deployment. The backend's LLM key is read from the GROQ_API_KEY environment
# variable and is never stored in this file.

services:
  # Base de datos MariaDB
  db:
    image: mariadb:10.6
    container_name: moodle_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: moodle
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    volumes:
      - moodle_db_data:/var/lib/mysql
    networks:
      - moodle_network

  # Moodle
  moodle:
    image: bitnami/moodle:latest
    container_name: moodle_app
    restart: always
    depends_on:
      - db
    environment:
      MOODLE_DATABASE_HOST: db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: moodle
      MOODLE_DATABASE_PASSWORD: moodle
      MOODLE_DATABASE_NAME: moodle
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
      MOODLE_EMAIL: admin@example.com
      MOODLE_SITE_NAME: "BurnoutGuard Demo"
      MOODLE_SKIP_BOOTSTRAP: "no"
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_MAX_FILESIZE: 256M
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - moodle_data:/bitnami/moodle
      - moodle_moodledata:/bitnami/moodledata
      # Montamos el plugin
      - ./moodle_plugin/local/burnoutguard:/bitnami/moodle/local/burnoutguard
    networks:
      - moodle_network

  # Backend Python (BurnoutGuard API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: burnoutguard_api
    restart: always
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: llama-3.3-70b-versatile
    ports:
      - "8000:8000"
    networks:
      - moodle_network

volumes:
  moodle_db_data:
  moodle_data:
  moodle_moodledata:


networks:
  moodle_network:
    driver: bridge
